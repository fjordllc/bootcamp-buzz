<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fjord buzz extension</title>
    <link rel="stylesheet" href="popup.css" type="text/css" />
    <script type="module" src="popup.js"></script>
  </head>

  <body>
    <div class="loader"></div>
    <div id="status-message"></div>
    <div class="content">
      <div class="login">
        <form id="login-form">
          <p>
            <label for="login_name">login name:</label>
            <input type="text" id="login_name" name="login_name" />
          </p>
          <p>
            <label for="password">password:</label>
            <input type="password" id="password" name="password" />
          </p>
          <input type="submit" value="Submit" />
        </form>
      </div>
      <div class="main">
        <form id="upsert-form">
          <p>
            <label for="title">title:</label>
            <input type="text" id="title" name="title" />
          </p>
          <p>
            <label for="url">url</label>
            <input type="text" id="url" name="url" readonly />
          </p>
          <p>
            <label for="published_at">published_at</label>
            <input type="date" id="published_at" name="published_at" />
          </p>
          <p>
            <label for="memo">memo</label>
            <textarea id="memo" name="memo"></textarea>
          </p>
          <input type="submit" value="Submit" />
        </form>
        <a href="#" id="delete-link" class="delete-link">削除</a>
        <a href="#" id="logout-link" class="logout-link">ログアウト</a>
      </div>
    </div>
  </body>
</html>
